<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberAgent / Varnost se začne pri tebi</title>
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="Praktične vaje prepoznavanja spletnih prevar in pregleden nadzor varnostnega usposabljanja.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">{c}</div>
        <div>
          <div class="brand-name">cyberagent<span class="brand-cursor" aria-hidden="true">_</span></div>
          <div class="brand-sub">Varnost skozi prakso</div>
        </div>
      </div>
      <div id="identity"></div>
      <nav class="nav" aria-label="Glavna navigacija"></nav>
      <button class="btn sidebar-logout" data-logout>Zamenjaj prijavo</button>
      <div class="wallet" id="wallet"></div>
    </aside>
    <div class="workspace">
      <header class="workspace-bar">
        <div class="workspace-path" id="workspace-path" aria-label="Trenutni pogled"></div>
        <div class="workspace-mode">PROTOTIP / V3</div>
      </header>
      <main class="main" id="view" tabindex="-1"></main>
      <footer class="workspace-footer"><span><span class="footer-symbol" aria-hidden="true">&lt;/&gt;</span> cyberagent / varnost skozi prakso</span><span>Opazuj. Preveri. Prijavi.</span></footer>
    </div>
  </div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="statusbar" id="statusbar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
